<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f2fe"/>
      <stop offset="100%" style="stop-color:#f0f9ff"/>
    </linearGradient>
    <linearGradient id="mon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect x="30" y="30" width="340" height="240" rx="20" fill="white" opacity="0.5"/>
  <!-- Monitor -->
  <rect x="100" y="50" width="200" height="130" rx="8" fill="url(#mon)"/>
  <rect x="110" y="58" width="180" height="110" rx="4" fill="#1e3a5f"/>
  <!-- Screen glow -->
  <rect x="115" y="63" width="170" height="100" rx="2" fill="#0ea5e9" opacity="0.3"/>
  <!-- Stand -->
  <rect x="185" y="180" width="30" height="20" fill="#334155"/>
  <rect x="160" y="200" width="80" height="8" rx="4" fill="#334155"/>
  <!-- Screen content -->
  <text x="200" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#38bdf8">27" 165Hz</text>
  <text x="200" y="140" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7dd3fc">IPS Panel</text>
  <text x="200" y="260" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0284c7">Gaming Monitor</text>
</svg>