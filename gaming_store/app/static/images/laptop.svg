<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f2fe"/>
      <stop offset="100%" style="stop-color:#f0f9ff"/>
    </linearGradient>
    <linearGradient id="lap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect x="30" y="30" width="340" height="240" rx="20" fill="white" opacity="0.5"/>
  <!-- Laptop screen -->
  <rect x="110" y="45" width="180" height="120" rx="8" fill="url(#lap)"/>
  <rect x="118" y="53" width="164" height="104" rx="4" fill="#1e3a5f"/>
  <!-- Screen content -->
  <text x="200" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#38bdf8">RTX 4060</text>
  <text x="200" y="118" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7dd3fc">15.6" 144Hz</text>
  <!-- Webcam -->
  <circle cx="200" cy="50" r="3" fill="#334155"/>
  <!-- Keyboard base -->
  <rect x="100" y="165" width="200" height="8" rx="2" fill="#334155"/>
  <path d="M90,173 L310,173 L320,190 L80,190 Z" fill="#334155"/>
  <!-- Trackpad -->
  <rect x="175" y="176" width="50" height="10" rx="2" fill="#1e3a5f"/>
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0284c7">Gaming Laptop</text>
</svg>