  <circle cx="200" cy="85" r="16" fill="#0f172a"/>
  <circle cx="200" cy="85" r="10" fill="#0ea5e9" opacity="0.3"/>
  <circle cx="200" cy="85" r="4" fill="#38bdf8"/>
