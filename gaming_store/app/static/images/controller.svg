<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f2fe"/>
      <stop offset="100%" style="stop-color:#f0f9ff"/>
    </linearGradient>
    <linearGradient id="ctrl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect x="30" y="30" width="340" height="240" rx="20" fill="white" opacity="0.5"/>
  <!-- Controller body -->
  <ellipse cx="200" cy="140" rx="100" ry="50" fill="url(#ctrl)"/>
  <ellipse cx="140" cy="160" rx="35" ry="25" fill="#0284c7"/>
  <ellipse cx="260" cy="160" rx="35" ry="25" fill="#0284c7"/>
  <!-- Joysticks -->
  <circle cx="165" cy="130" r="12" fill="#1e3a5f"/>
  <circle cx="235" cy="130" r="12" fill="#1e3a5f"/>
  <circle cx="165" cy="130" r="6" fill="#334155"/>
  <circle cx="235" cy="130" r="6" fill="#334155"/>
  <!-- Buttons -->
  <circle cx="255" cy="115" r="7" fill="#38bdf8"/>
  <circle cx="270" cy="130" r="7" fill="#38bdf8"/>
  <circle cx="255" cy="145" r="7" fill="#38bdf8"/>
  <circle cx="240" cy="130" r="7" fill="#38bdf8"/>
  <!-- D-pad -->
  <rect x="150" y="115" width="10" height="30" rx="3" fill="#1e3a5f"/>
  <rect x="143" y="122" width="24" height="10" rx="3" fill="#1e3a5f"/>
  <!-- Center buttons -->
  <circle cx="185" cy="125" r="5" fill="#7dd3fc"/>
  <circle cx="215" cy="125" r="5" fill="#7dd3fc"/>
  <text x="200" y="245" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0284c7">DualSense Controller</text>
</svg>