<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f2fe"/>
      <stop offset="100%" style="stop-color:#f0f9ff"/>
    </linearGradient>
    <linearGradient id="mp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect x="30" y="30" width="340" height="240" rx="20" fill="white" opacity="0.5"/>
  <!-- Mousepad -->
  <rect x="80" y="70" width="240" height="140" rx="12" fill="url(#mp)"/>
  <rect x="85" y="75" width="230" height="130" rx="10" fill="#1e3a5f"/>
  <!-- RGB edge glow -->
  <rect x="80" y="70" width="240" height="140" rx="12" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.7"/>
  <!-- Surface texture -->
  <rect x="95" y="85" width="210" height="110" rx="6" fill="#0ea5e9" opacity="0.15"/>
  <!-- Logo area -->
  <text x="200" y="145" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#38bdf8">XL Extended</text>
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0284c7">RGB Mousepad</text>
</svg>