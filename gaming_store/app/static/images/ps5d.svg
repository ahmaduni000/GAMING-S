<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f2fe"/>
      <stop offset="100%" style="stop-color:#f0f9ff"/>
    </linearGradient>
    <linearGradient id="console" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect x="30" y="30" width="340" height="240" rx="20" fill="white" opacity="0.5"/>
  <!-- PS5 Digital - slimmer -->
  <rect x="170" y="50" width="60" height="140" rx="5" fill="url(#console)"/>
  <rect x="165" y="45" width="70" height="150" rx="8" fill="#1e3a5f"/>
  <rect x="168" y="48" width="64" height="144" rx="6" fill="url(#console)"/>
  <!-- Black center line -->
  <rect x="197" y="55" width="6" height="130" fill="#0f172a"/>
  <!-- Blue accent -->
  <rect x="196" y="145" width="8" height="4" rx="2" fill="#38bdf8"/>
  <!-- Stand -->
  <rect x="185" y="190" width="30" height="10" rx="3" fill="#334155"/>
  <text x="200" y="245" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0284c7">PS5 Digital Edition</text>
</svg>