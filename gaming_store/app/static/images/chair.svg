<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f2fe"/>
      <stop offset="100%" style="stop-color:#f0f9ff"/>
    </linearGradient>
    <linearGradient id="ch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect x="30" y="30" width="340" height="240" rx="20" fill="white" opacity="0.5"/>
  <!-- Chair back -->
  <path d="M150,50 Q200,30 250,50 L255,160 Q200,170 145,160 Z" fill="url(#ch)"/>
  <path d="M155,55 Q200,38 245,55 L248,155 Q200,162 152,155 Z" fill="#1e3a5f"/>
  <!-- Headrest -->
  <rect x="170" y="40" width="60" height="25" rx="12" fill="#38bdf8"/>
  <!-- Seat -->
  <ellipse cx="200" cy="180" rx="65" ry="20" fill="url(#ch)"/>
  <!-- Armrests -->
  <rect x="130" y="140" width="15" height="45" rx="4" fill="#334155"/>
  <rect x="255" y="140" width="15" height="45" rx="4" fill="#334155"/>
  <rect x="125" y="135" width="25" height="8" rx="3" fill="#334155"/>
  <rect x="250" y="135" width="25" height="8" rx="3" fill="#334155"/>
  <!-- Base -->
  <rect x="195" y="200" width="10" height="30" fill="#334155"/>
  <path d="M160,235 L200,225 L240,235" stroke="#334155" stroke-width="4" fill="none"/>
  <circle cx="160" cy="237" r="5" fill="#334155"/>
  <circle cx="200" cy="227" r="5" fill="#334155"/>
  <circle cx="240" cy="237" r="5" fill="#334155"/>
  <text x="200" y="270" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0284c7">Gaming Chair</text>
</svg>