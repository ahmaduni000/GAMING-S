<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f2fe"/>
      <stop offset="100%" style="stop-color:#f0f9ff"/>
    </linearGradient>
    <linearGradient id="ssd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect x="30" y="30" width="340" height="240" rx="20" fill="white" opacity="0.5"/>
  <!-- SSD body -->
  <rect x="120" y="60" width="160" height="100" rx="8" fill="url(#ssd)"/>
  <rect x="130" y="70" width="140" height="80" rx="4" fill="#1e3a5f"/>
  <!-- Label -->
  <text x="200" y="105" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#38bdf8">NVMe</text>
  <text x="200" y="125" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7dd3fc">1TB M.2</text>
  <!-- Connector -->
  <rect x="120" y="145" width="160" height="15" rx="3" fill="#334155"/>
  <!-- Pins -->
  <rect x="135" y="148" width="3" height="8" fill="#7dd3fc"/>
  <rect x="145" y="148" width="3" height="8" fill="#7dd3fc"/>
  <rect x="155" y="148" width="3" height="8" fill="#7dd3fc"/>
  <rect x="165" y="148" width="3" height="8" fill="#7dd3fc"/>
  <text x="200" y="245" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0284c7">1TB NVMe SSD</text>
</svg>