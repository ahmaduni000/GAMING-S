{% extends "base.html" %}
{% block title %}Server Error - GameZone Hub{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="text-center py-5">
        <div class="mb-4">
            <i class="fas fa-server text-danger" style="font-size: 5rem;"></i>
        </div>
        <h1 class="display-1 fw-bold text-muted">500</h1>
        <h2 class="fw-bold mb-3">Internal Server Error</h2>
        <p class="text-muted mb-4">Something went wrong on our end. Please try again later.</p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('main.home') }}" class="btn btn-primary btn-lg">
                <i class="fas fa-home me-1"></i>Go Home
            </a>
            <a href="javascript:location.reload()" class="btn btn-outline-primary btn-lg">
                <i class="fas fa-redo me-1"></i>Try Again
            </a>
        </div>
    </div>
</div>
{% endblock %}
