{% extends "base.html" %}
{% block title %}Access Denied - GameZone Hub{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="text-center py-5">
        <div class="mb-4">
            <i class="fas fa-lock text-danger" style="font-size: 5rem;"></i>
        </div>
        <h1 class="display-1 fw-bold text-muted">403</h1>
        <h2 class="fw-bold mb-3">Access Denied</h2>
        <p class="text-muted mb-4">You don't have permission to access this page.</p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('main.home') }}" class="btn btn-primary btn-lg">
                <i class="fas fa-home me-1"></i>Go Home
            </a>
            {% if current_user.is_authenticated %}
            <a href="{{ url_for('auth.profile') }}" class="btn btn-outline-primary btn-lg">
                <i class="fas fa-user me-1"></i>My Profile
            </a>
            {% else %}
            <a href="{{ url_for('auth.login') }}" class="btn btn-outline-primary btn-lg">
                <i class="fas fa-sign-in-alt me-1"></i>Login
            </a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
