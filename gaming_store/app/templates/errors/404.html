{% extends "base.html" %}
{% block title %}Page Not Found - GameZone Hub{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="text-center py-5">
        <div class="mb-4">
            <i class="fas fa-exclamation-triangle text-warning" style="font-size: 5rem;"></i>
        </div>
        <h1 class="display-1 fw-bold text-muted">404</h1>
        <h2 class="fw-bold mb-3">Page Not Found</h2>
        <p class="text-muted mb-4">The page you're looking for doesn't exist or has been moved.</p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('main.home') }}" class="btn btn-primary btn-lg">
                <i class="fas fa-home me-1"></i>Go Home
            </a>
            <a href="{{ url_for('products.listing') }}" class="btn btn-outline-primary btn-lg">
                <i class="fas fa-shopping-bag me-1"></i>Shop Now
            </a>
        </div>
    </div>
</div>
{% endblock %}
